# run_asap_ci.py supplies the loopback port for each run.

[agent]
model = "asap-test"

[providers]
fallback_chain = ["stub"]

[gateway]
enabled = true
host = "127.0.0.1"
port = {port}
require_pairing = true

[asap]
enabled = true
agent_urn = "urn:asap:agent:under-test"
agent_name = "ShellClaw-CI"
public_base_url = "http://127.0.0.1:{port}"
trusted_senders = ["urn:asap:agent:compliance-harness"]

[hardware]
enabled = false
